[project]
name = "sanad-blueprint"
version = "0.1.0"
description = "The .sanad blueprint kernel: schemas, indexer, graph compiler, and validation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12.5",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[build-system]
requires = ["uv_build>=0.8.5,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["sanad_blueprint"]
