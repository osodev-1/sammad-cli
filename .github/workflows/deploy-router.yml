name: deploy-router

# Build the sanad-router (AWS ingress for per-user workspace tasks) image and
# push it to GHCR and, when CI credentials are configured, to ECR.

on:
  push:
    branches: [main]
    paths:
      - "control-plane/artifacts/router/**"
      - "control-plane/pnpm-lock.yaml"
      - "control-plane/pnpm-workspace.yaml"
      - "control-plane/package.json"
      - ".github/workflows/deploy-router.yml"
  workflow_dispatch:

concurrency:
  group: deploy-router-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/sanad-router
  ECR_IMAGE: 382764426100.dkr.ecr.eu-central-1.amazonaws.com/sanad-router

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: control-plane/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/router run typecheck
      - run: pnpm --filter @workspace/router run test
        env:
          NODE_ENV: test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (GHCR)
        uses: docker/build-push-action@v6
        with:
          context: control-plane
          file: control-plane/artifacts/router/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Configure AWS credentials
        if: ${{ secrets.AWS_CI_ACCESS_KEY_ID != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_CI_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_CI_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1
      - name: Log in to ECR
        if: ${{ secrets.AWS_CI_ACCESS_KEY_ID != '' }}
        uses: aws-actions/amazon-ecr-login@v2
      - name: Mirror manifest to ECR (no rebuild)
        if: ${{ secrets.AWS_CI_ACCESS_KEY_ID != '' }}
        run: |
          docker buildx imagetools create \
            -t "$ECR_IMAGE:latest" -t "$ECR_IMAGE:${{ github.sha }}" \
            "$GHCR_IMAGE:${{ github.sha }}"
