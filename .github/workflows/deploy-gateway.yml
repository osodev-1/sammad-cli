name: deploy-gateway

# Build the sanad-gateway (Azure Foundry proxy) image, push it to GHCR, then
# (once configured) redeploy it on Railway. No build-time secrets — the Foundry
# key, DATABASE_URL, etc. are injected at runtime as Railway service variables.

on:
  push:
    branches: [main]
    paths:
      - "control-plane/artifacts/api-server/**"
      - "control-plane/lib/**"
      - "control-plane/pnpm-lock.yaml"
      - "control-plane/pnpm-workspace.yaml"
      - "control-plane/package.json"
      - ".github/workflows/deploy-gateway.yml"
  workflow_dispatch:

concurrency:
  group: deploy-gateway-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/sanad-gateway

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: control-plane/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck:libs
      - run: pnpm --filter @workspace/api-server run typecheck

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: control-plane
          file: control-plane/artifacts/api-server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Enable by setting repo variable RAILWAY_SERVICE_GATEWAY + secret RAILWAY_TOKEN.
    if: ${{ vars.RAILWAY_SERVICE_GATEWAY != '' }}
    steps:
      - name: Redeploy on Railway
        run: |
          npm i -g @railway/cli
          railway redeploy --service "${{ vars.RAILWAY_SERVICE_GATEWAY }}" --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
