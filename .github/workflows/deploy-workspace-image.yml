name: deploy-workspace-image

# Build the per-user workspace machine image (agentd task mode + the sanad CLI
# + user dev toolchains) and push it to GHCR and, when CI credentials are
# configured, to ECR for Fargate to pull. No secrets are baked into the image.

on:
  push:
    branches: [main]
    paths:
      - "terminal-server/**"
      - "src/**"
      - "packages/**"
      - "sdks/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy-workspace-image.yml"
  workflow_dispatch:

concurrency:
  group: deploy-workspace-image-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/sanad-workspace
  ECR_IMAGE: 382764426100.dkr.ecr.eu-central-1.amazonaws.com/sanad-workspace

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v1
        with:
          version: "0.8.5"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --all-packages
      - run: uv run pytest terminal-server/tests tests/sanad -vv
        env:
          PYTHONUTF8: "1"

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      HAS_AWS_CI: ${{ secrets.AWS_CI_ACCESS_KEY_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (GHCR)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: terminal-server/Dockerfile
          target: task
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Configure AWS credentials
        # Enabled once the sanad-ci IAM user's keys exist as repo secrets.
        if: ${{ env.HAS_AWS_CI == 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_CI_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_CI_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1
      - name: Log in to ECR
        if: ${{ env.HAS_AWS_CI == 'true' }}
        uses: aws-actions/amazon-ecr-login@v2
      - name: Mirror manifest to ECR (no rebuild)
        if: ${{ env.HAS_AWS_CI == 'true' }}
        run: |
          docker buildx imagetools create \
            -t "$ECR_IMAGE:latest" -t "$ECR_IMAGE:${{ github.sha }}" \
            "$GHCR_IMAGE:${{ github.sha }}"
