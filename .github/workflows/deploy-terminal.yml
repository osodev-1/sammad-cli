name: deploy-terminal

# Build the sanad-terminal (browser-workspace PTY bridge + workspace API)
# image, push it to GHCR, then (once configured) redeploy it on Railway. No
# build-time secrets — TERMINAL_SHARED_SECRET etc. are Railway runtime vars.

on:
  push:
    branches: [main]
    paths:
      - "terminal-server/**"
      - "src/**"
      - "packages/**"
      - "sdks/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy-terminal.yml"
  workflow_dispatch:

concurrency:
  group: deploy-terminal-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/sanad-terminal

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v1
        with:
          version: "0.8.5"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --all-packages
      - run: uv run pytest terminal-server/tests tests/sanad -vv
        env:
          PYTHONUTF8: "1"

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: terminal-server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Enable by setting repo variable RAILWAY_SERVICE_TERMINAL + secret RAILWAY_TOKEN.
    if: ${{ vars.RAILWAY_SERVICE_TERMINAL != '' }}
    steps:
      - name: Redeploy on Railway
        run: |
          npm i -g @railway/cli
          railway redeploy --service "${{ vars.RAILWAY_SERVICE_TERMINAL }}" --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
