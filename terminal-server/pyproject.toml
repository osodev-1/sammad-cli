[project]
name = "sanad-terminal"
version = "0.1.0"
description = "WebSocket PTY bridge + workspace API that runs the governed sanad agent for the browser workspace."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # kimi-cli is a dependency so the `sanad` console script is co-installed
    # in this environment; sanad_terminal never imports kimi_cli EXCEPT for
    # routes_worker.py's use of kimi_cli.worker (derive_agent_spec /
    # load_worker_spec / render_input_prompt) and kimi_cli.exception
    # (AgentSpecError) — the one sanctioned exception, since deriving a
    # worker's agent spec is the CLI's own logic and must not be duplicated.
    "kimi-cli",
    "sanad-blueprint",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27",
    "pydantic>=2.12.5",
    "loguru>=0.6.0,<0.8",
    "python-multipart>=0.0.18",
    # The blueprint watcher imports watchfiles directly (it also arrives
    # transitively via uvicorn[standard], but the direct use makes it explicit).
    "watchfiles>=0.24",
]

[project.scripts]
sanad-terminal = "sanad_terminal.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "websockets>=14.0",
]

[tool.uv.sources]
kimi-cli = { workspace = true }
sanad-blueprint = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.5,<0.10.0"]
build-backend = "uv_build"
